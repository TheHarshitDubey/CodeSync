spring.application.name=codesync-backend
server.port=8080

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codesync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT ---
# Generate your own secret, e.g.: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:this-is-a-local-dev-secret-change-me-before-deploying-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Judge0 (code execution) ---
# Using the free public instance ? no API key needed, no card required.
# Switch to RapidAPI (add JUDGE0_API_KEY + JUDGE0_API_HOST) before a real
# interview demo for more reliable rate limits.
app.judge0.base-url=${JUDGE0_BASE_URL:https://ce.judge0.com}
app.judge0.api-key=${JUDGE0_API_KEY:}
app.judge0.api-host=${JUDGE0_API_HOST:}

# --- Misc ---
logging.level.com.codesync=DEBUG
